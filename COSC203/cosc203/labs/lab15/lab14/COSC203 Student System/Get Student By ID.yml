info:
  name: Get Student By ID
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8085/api/students/1169
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1169"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
