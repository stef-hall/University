<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polly's Travel Blog — Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>
<body>
  <header><h1>Polly's Travel Blog</h1></header>
  <nav aria-label="Main navigation">
    <h2 class="navigation-heading">Navigation</h2>
    <ul><li><a href="index.html">Home</a></li><li><a href="stories.html">Stories</a></li><li><a href="contact.html">Contact</a></li></ul>
  </nav>
  <main class="page-main">
    <h2 class="page-title">Contact Details</h2>
    <section id="contact_links" aria-labelledby="contact-links-title">
      <h3 id="contact-links-title">Get in touch</h3>
      <a href="https://www.newzealand.com/nz/penguins/">My website</a>
      <a href="mailto:polly@example.com">Email Me</a>
      <a href="tel:+555 5555">Call Me</a>
    </section>
    <section id="contact-form" aria-labelledby="contact-form-title">
      <h3 id="contact-form-title">Send Polly a message</h3>
      <div id="form-contact-container">
        <form action="#" method="post">
          <fieldset id="fieldset-contact">
            <legend>Contact Information</legend>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="species">Favourite species</label>
            <select id="species" name="species">
              <option value="">Choose one</option>
              <option value="penguin">Penguin</option>
              <option value="seal">Seal</option>
              <option value="albatross">Albatross</option>
              <option value="other">Other</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <div class="button-container">
              <button type="submit">Submit</button>
              <button type="reset">Reset</button>
            </div>
          </fieldset>
        </form>
      </div>
    </section>
  </main>
  <footer><p>&copy; Copyright 2026 by Polly. No rights reserved.</p></footer>
</body>
</html>
