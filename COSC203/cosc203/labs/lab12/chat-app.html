<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Polly Chat</title>
	<link preload rel="stylesheet" href="chat-app.css">
    <script defer src="chat-app.js"></script>
</head>

<body>
	<header>Polly Chat</header>

	<main id="chat-log-container">

		<div class="message-self">
			<p>Hello World 😊</p>
		</div>

		<div class="message-other">
			<p>Hello Polly 😀</p>
		</div>

	</main>

	<form id="message-form">
		<input id="message-text" type="text" autocomplete="off" placeholder="message...">
		<button id="message-button" type="button">Send</button>
	</form>

</body>

</html>
